# Publie une mise à jour de l'app mobile depuis GitHub, sans passer par un poste.
#
# ## Pourquoi ce workflow existe
#
# `eas update` se lance normalement depuis une machine de développement. Sur un
# poste d'entreprise, ça ne marche pas toujours : npm y échoue avec
# `ECOMPROMISED / Lock compromised`, un verrou de cache retiré sous ses pieds —
# antivirus, stratégie de groupe, dossier redirigé, on ne sait pas toujours.
# Déboguer l'environnement d'un poste géré par une DSI est une bataille sans fin
# et qu'on ne gagne pas durablement : le prochain poste aura son propre lot.
#
# GitHub Actions part d'une machine neuve à chaque fois, avec un npm sain. Ce qui
# marche ici marchera encore dans six mois, quel que soit le poste devant lequel
# on est assis.
#
# ## Le secret
#
# Il faut un jeton Expo, à déposer **dans GitHub** et nulle part ailleurs :
#
#   Settings → Secrets and variables → Actions → New repository secret
#   Nom : EXPO_TOKEN
#
# Le créer sur https://expo.dev → Settings → Access tokens. GitHub le chiffre,
# ne le réaffiche jamais, et le masque dans les journaux d'exécution. C'est toute
# la différence avec un jeton collé dans une conversation ou dans un fichier :
# celui-là, personne ne le relit.
#
# ## S'en servir
#
#   Onglet Actions → « Mise à jour de l'app mobile » → Run workflow
#
# On choisit la branche de publication. `preview` alimente les installations de
# test ; `production` touche ce que les gens ont sur leur téléphone, d'où le fait
# qu'elle ne soit pas le choix par défaut.
name: Mise à jour de l'app mobile

on:
  workflow_dispatch:
    inputs:
      canal:
        description: Canal de publication
        type: choice
        default: preview
        options: [preview, production]
      message:
        description: Message associé à la mise à jour
        type: string
        default: Mise à jour depuis GitHub

jobs:
  publier:
    name: eas update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # La version d'eas-cli est **figée**, et c'est la leçon la plus chère de
      # ce workflow.
      #
      # `latest` a silencieusement changé la version d'exécution des mises à
      # jour. Le 14 août, une build iPhone est sortie avec l'empreinte
      # `f676bc3d…` ; le 20, eas-cli est passé de 21.8 à 22.2, et les mises à
      # jour publiées depuis portent `57e54335…`. Même dépôt, même verrou,
      # aucun fichier natif touché — c'est l'outil qui a changé sa façon de
      # calculer l'empreinte.
      #
      # Conséquence : le téléphone a cessé de recevoir quoi que ce soit, sans
      # message ni erreur. Le canal servait toujours les mises à jour, mais
      # plus à ce binaire-là. Quinze jours de corrections publiées dans le vide.
      #
      # Une version figée fait échouer bruyamment ce qui échouait en silence.
      # La monter est alors une décision, et elle s'accompagne d'une build.
      - name: Installer eas-cli
        uses: expo/expo-github-action@v8
        with:
          eas-version: 22.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      # `npm ci` et non `npm install` : on veut exactement les versions du
      # verrou, pas ce que le registre propose aujourd'hui. Une mise à jour
      # publiée doit être reproductible à l'identique.
      #
      # La **racine** est installée elle aussi, et ce n'est pas superflu : les
      # tests de `mobile/src` importent `vitest`, qui n'est déclaré qu'à la
      # racine. En local ça passe — Node remonte l'arborescence et le trouve —
      # mais un poste de CI n'installe que ce qu'on lui demande. Le premier jet
      # ne posait que `mobile/` et `tsc` échouait sur `Cannot find module
      # 'vitest'`. Le `postinstall` de la racine lance `prisma generate`, qui
      # n'a besoin d'aucune base : vérifié sans `DATABASE_URL`.
      - name: Installer les dépendances de la racine
        run: npm ci

      - name: Installer les dépendances de l'app
        working-directory: mobile
        run: npm ci

      # Les contrôles qui gardent une publication mobile. Elle arrive sur des
      # téléphones sans qu'on puisse la reprendre, contrairement à un
      # déploiement web qu'on redéploie — d'où le fait de ne pas publier à
      # l'aveugle.
      #
      # Deux commandes qu'on lance en local sont volontairement absentes :
      #
      #  · `npm run lint` — le dépôt porte une dette connue de 42 signalements,
      #    la commande sort en erreur et bloquerait toute publication. La
      #    remettre ici demandera d'abord de solder cette dette.
      #
      #  · `tsc` à la racine — `tsconfig.json` inclut `.next/types/**`, où Next
      #    **génère** `PageProps` et `LayoutProps`. Sans `next build` préalable
      #    ces types n'existent pas et le contrôle échoue sur du code
      #    parfaitement valide. En local le dossier `.next` traîne, ce qui
      #    masque la dépendance. Vérifier le site demanderait de le construire,
      #    donc une base de données et des variables d'environnement — pour
      #    garder une publication *mobile*. Le rapport n'y est pas.
      #
      # Les tests unitaires, eux, couvrent `lib/` : toute la logique que le
      # serveur et l'app se partagent.
      - name: Tests unitaires
        run: npx vitest run

      - name: Vérifier les types de l'app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Publier
        working-directory: mobile
        run: |
          eas update \
            --branch "${{ inputs.canal }}" \
            --environment "${{ inputs.canal }}" \
            --message "${{ inputs.message }}" \
            --non-interactive
